name: Tachyon Cloud App build
description: Build a dispatched Lambda ZIP and return it to Tachyon using GitHub OIDC
inputs:
  api-url:
    description: Trusted Tachyon API origin; override only in the protected workflow, not dispatch inputs
    required: false
    default: https://api.n1.tachy.one
  build-id:
    description: Build ID supplied by Tachyon workflow_dispatch
    required: true
  rust-builder-image:
    description: Digest-pinned image for cargo lambda builds (rustup, cargo-lambda, zig, protoc on PATH)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Build and report to Tachyon
      shell: bash
      env:
        TACHYON_BUILD_API_URL: ${{ inputs.api-url }}
        TACHYON_BUILD_ID: ${{ inputs.build-id }}
        TACHYON_BUILD_RUST_IMAGE: ${{ inputs.rust-builder-image }}
        TACHYON_BUILD_GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/run.mjs"
