name: Tachyon Cloud App build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Tachyon build ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: tachyon-build-${{ inputs.build_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # App commands run inside the Action's Node.js container.
      # Toolchains installed on this runner are not visible there.
      # Pin the Action to the reviewed implementation commit before use.
      - uses: quantum-box/tachyon-ops-action/cloud-app-build@REPLACE_WITH_COMMIT_SHA
        with:
          build-id: ${{ inputs.build_id }}
          # cargo lambda apps only: a digest-pinned toolchain image.
          # rust-builder-image: ghcr.io/OWNER/IMAGE@sha256:REPLACE_WITH_DIGEST
